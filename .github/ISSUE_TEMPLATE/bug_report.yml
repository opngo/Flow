name: Bug report
description: Something in Flow is broken or behaves unexpectedly.
title: '[bug]: '
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Two things make a bug report
        ten times easier to fix: the exact steps that reproduce it, and whether
        it happens in the packaged app, in `npm run dev`, or both.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release (or on `main`)
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, in plain words.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings, Typography
        2. Import a .woff2 file
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen
      multiple: true
      options:
        - Windows installer
        - macOS app
        - Linux AppImage
        - Browser dev server (npm run dev)
        - More than one
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flow version
      description: Shown in Settings, About. Use the commit SHA if you built from source.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2, macOS 15.1, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: |
        Press Ctrl+Shift+I (Cmd+Option+I on macOS) to open devtools. If you saw the
        in-app error panel, use its "Copy report" button and paste here. Please
        remove anything personal before submitting.
      render: shell
    validations:
      required: false
  - type: textarea
    id: data
    attributes:
      label: Anything else
      description: Screenshots, a trimmed export of the data involved, or related issues.
    validations:
      required: false
