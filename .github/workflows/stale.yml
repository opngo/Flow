name: Stale

on:
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Close stale items
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 21
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security
          stale-issue-message: >-
            This issue has had no activity for 60 days, so it is being marked stale.
            Comment to keep it open; it closes automatically in 21 days.
          stale-pr-message: >-
            This pull request has had no activity for 45 days. Rebase and comment to keep it open.
          close-issue-message: >-
            Closing after 21 days without activity. Reopen any time if it is still relevant.
          close-pr-message: >-
            Closing after 14 days without activity. Reopen when you are ready to continue.
